    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "local-tools",
        "url": "https://cranemont.github.io/local-tools/",
        "description": "설치 없이 브라우저에서 쓰는 도구 모음. 모든 처리는 브라우저 안에서 이뤄지고 파일은 서버로 전송되지 않습니다.",
        "inLanguage": "ko",
        "hasPart": [
          {
            "@type": "WebApplication",
            "name": "local-tools PDF",
            "url": "https://cranemont.github.io/local-tools/pdf/",
            "description": "PDF 병합·페이지 정리·회전, 이미지→PDF, PDF→PNG 변환, 암호 설정·해제"
          },
          {
            "@type": "WebApplication",
            "name": "local-tools GIF",
            "url": "https://cranemont.github.io/local-tools/gif/",
            "description": "GIF 프레임 편집, 이미지·동영상을 GIF·WebP·MP4로 변환"
          },
          {
            "@type": "WebApplication",
            "name": "local-tools 동영상",
            "url": "https://cranemont.github.io/local-tools/video/",
            "description": "동영상 구간 자르기(트림)·용량 압축·MP4·WebM 변환·소리 추출"
          }
        ]

    <style>
      :root {
        color-scheme: light dark;
        --accent: light-dark(oklch(0.62 0.158 240), oklch(0.716 0.125 240));
        --accent-weak: light-dark(
          oklch(0.62 0.158 240 / 0.09),
          oklch(0.716 0.125 240 / 0.14)
        );
        --muted: light-dark(oklch(0.51 0.022 248), oklch(0.685 0.018 245));
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Pretendard", -apple-system, BlinkMacSystemFont,
          "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
        background: light-dark(oklch(0.978 0.003 240), oklch(0.172 0.008 250));
        color: light-dark(oklch(0.235 0.015 250), oklch(0.93 0.006 240));
        -webkit-font-smoothing: antialiased;
      }
      main {
        text-align: center;
        padding: 40px;
      }
      h1 {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin: 0;
        font-weight: 600;
        font-size: 17px;
        letter-spacing: -0.01em;
      }
      h1 .dot {
        fill: var(--accent);
      }
      .tagline {
        margin: 10px 0 0;
        font-size: 13.5px;
        color: var(--muted);
      }
      .tools {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-top: 28px;
      }
      a.tool {
        display: block;
        width: 168px;
        padding: 16px 18px 15px;
        border-radius: 12px;
        text-decoration: none;
        background: var(--accent-weak);
        text-align: center;
      }
      a.tool:hover {
        outline: 1.5px solid var(--accent);
        outline-offset: -1.5px;
      }
      a.tool strong {
        display: block;
        font-weight: 600;
        font-size: 15px;
        color: var(--accent);
      }
      a.tool span {
        display: block;
        margin-top: 5px;
        font-size: 12px;
        line-height: 1.5;
        color: var(--muted);
        text-wrap: balance;
        word-break: keep-all;
      }
      .note {
        margin-top: 30px;
        font-size: 12.5px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>
        <svg width="20" height="20" viewBox="0 0 18 18" aria-hidden="true">
          <rect x="1.6" y="1.6" width="14.8" height="14.8" rx="4.8" fill="none" stroke="currentColor" stroke-width="1.6" />
          <circle class="dot" cx="9" cy="9" r="3.2" />
        </svg>
        local-tools
      </h1>
      <p class="tagline">브라우저에서만 동작하는 도구 모음</p>
      <nav class="tools">
        <a class="tool" href="./pdf/">
          <strong>PDF</strong>
          <span>병합 · 정리 · 이미지 변환 · 암호</span>
        </a>
        <a class="tool" href="./gif/">
          <strong>GIF</strong>
          <span>프레임&nbsp;편집 · 동영상&nbsp;변환&nbsp;· WebP·MP4</span>
        </a>
        <a class="tool" href="./video/">
          <strong>동영상</strong>
          <span>자르기 · 압축 · 변환&nbsp;· 소리&nbsp;추출</span>
        </a>
      </nav>
      <p class="note">파일은 브라우저 밖으로 나가지 않아요</p>
    </main>
  </body>
</html>
