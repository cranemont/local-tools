<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'%3E%3Crect x='1' y='1' width='16' height='16' rx='5' fill='oklch(0.62 0.158 240)'/%3E%3Ccircle cx='9' cy='9' r='3.4' fill='white'/%3E%3C/svg%3E"
    />
    <title>local-tools</title>
    <meta
      name="description"
      content="브라우저 안에서만 동작하는 개인 도구 모음. 파일은 전송되지 않습니다."
    />
    <style>
      :root {
        color-scheme: light dark;
        --accent: light-dark(oklch(0.62 0.158 240), oklch(0.716 0.125 240));
        --accent-weak: light-dark(
          oklch(0.62 0.158 240 / 0.09),
          oklch(0.716 0.125 240 / 0.14)
        );
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Pretendard", -apple-system, BlinkMacSystemFont,
          "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
        background: light-dark(oklch(0.978 0.003 240), oklch(0.172 0.008 250));
        color: light-dark(oklch(0.235 0.015 250), oklch(0.93 0.006 240));
        -webkit-font-smoothing: antialiased;
      }
      main {
        text-align: center;
        padding: 40px;
      }
      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-weight: 600;
        font-size: 16px;
        letter-spacing: -0.01em;
      }
      .brand .dot {
        fill: var(--accent);
      }
      .tools {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-top: 28px;
      }
      a.tool {
        display: block;
        padding: 13px 30px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 600;
        font-size: 15px;
        color: var(--accent);
        background: var(--accent-weak);
      }
      a.tool:hover {
        outline: 1.5px solid var(--accent);
        outline-offset: -1.5px;
      }
      .note {
        margin-top: 30px;
        font-size: 12.5px;
        color: light-dark(oklch(0.51 0.022 248), oklch(0.685 0.018 245));
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <svg width="20" height="20" viewBox="0 0 18 18" aria-hidden="true">
          <rect x="1.6" y="1.6" width="14.8" height="14.8" rx="4.8" fill="none" stroke="currentColor" stroke-width="1.6" />
          <circle class="dot" cx="9" cy="9" r="3.2" />
        </svg>
        <span>local-tools</span>
      </div>
      <nav class="tools">
        <a class="tool" href="./pdf/">PDF</a>
        <a class="tool" href="./gif/">GIF</a>
      </nav>
      <p class="note">파일은 브라우저 밖으로 나가지 않아요</p>
    </main>
  </body>
</html>
