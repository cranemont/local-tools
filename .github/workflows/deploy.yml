# main 푸시마다 전체 앱을 빌드해 GitHub Pages로 배포한다.
# 산출 구조: / (site/index.html 랜딩) · /pdf/ · /gif/ · /video/ · /dev/ · /image/ · /sheet/ · /doc/ · /drop/ · /lab/
#   + /guide/ (손으로 쓴 정적 가이드)
# — 대부분 자기완결 단일 HTML. 예외 둘: /sheet/·/doc/(PWA — 파일 연결용.
#   /doc/에는 한글 렌더러 wasm도 함께 올라간다).
# apps/stack(기술 지도)은 **배포하지 않는다** — 저장소를 설명하는 개발용 화면이라
#   `pnpm dev:stack`으로 로컬에서만 띄운다. 빌드·검사는 그대로 돈다.
#   /lab/은 단일 HTML이지만 모델을 실행 시점에 외부에서 받는다(그래서 오프라인이 아니다).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # sitemap의 lastmod를 git 이력에서 뽑으므로 얕게 받으면 안 된다.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4 # 버전은 package.json의 packageManager를 따른다
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Assemble site
        run: |
          mkdir -p _site/pdf _site/gif _site/video _site/dev _site/image _site/drop _site/sheet _site/doc _site/lab
          cp -R site/. _site/
          cp apps/pdf/dist/index.html _site/pdf/index.html
          cp apps/gif/dist/index.html _site/gif/index.html
          cp apps/video/dist/index.html _site/video/index.html
          cp apps/dev/dist/index.html _site/dev/index.html
          cp apps/image/dist/index.html _site/image/index.html
          cp apps/drop/dist/index.html _site/drop/index.html
          cp apps/lab/dist/index.html _site/lab/index.html
          # 시트는 두 벌이다. /sheet/는 PWA(설치해야 .csv 더블클릭이 이 앱으로 온다),
          # 단일 HTML은 그 옆에 내려받기용으로 둔다.
          cp -R apps/sheet/dist-pwa/. _site/sheet/
          cp apps/sheet/dist/index.html _site/sheet/local-tools-sheet.html
          # 문서도 두 벌이다. /doc/의 PWA 쪽에 rhwp 엔진(wasm)이 들어 있고,
          # 내려받은 단일 HTML은 이 주소에서 그 엔진을 받아 간다(rhwp-wasm.ts 참고).
          cp -R apps/doc/dist-pwa/. _site/doc/
          cp apps/doc/dist/index.html _site/doc/local-tools-doc.html
          # 랜딩 카드의 용량 표기를 실제 빌드 산출물 크기로 갱신
          for app in pdf gif video dev image drop sheet doc lab; do
            kb=$(( $(stat -c%s "apps/$app/dist/index.html") / 1024 ))
            sed -i "s|data-size=\"$app\">[^<]*<|data-size=\"$app\">${kb} KB<|" _site/index.html
          done
          # sitemap의 lastmod를 실제 마지막 변경일로. 손으로 적으면 반드시 낡고,
          # 낡은 lastmod는 재크롤 우선순위를 반대로 낮춘다.
          node scripts/stamp-sitemap.mjs _site/sitemap.xml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # 배포가 끝난 뒤에 알린다 — 크롤러가 곧바로 와도 새 내용이 서 있어야 한다.
      # IndexNow는 Bing과 **네이버**가 함께 받는다(네이버는 2023-07부터 공식 지원).
      # 키는 비밀이 아니다 — site/<키>.txt로 공개 제공하는 것이 규격이다.
      # 실패해도 배포를 되돌리지 않는다(색인 힌트일 뿐이다).
      - name: IndexNow ping
        continue-on-error: true
        run: |
          KEY=95230c9d8dfc47b845257ce99be41f5a
          HOST=tools.cranemont.com
          URLS="\"https://$HOST/\""
          for p in pdf gif video image sheet doc drop dev lab \
                   guide guide/hwp-mac guide/hwp-to-pdf guide/hwp-to-markdown \
                   guide/phone-to-pc guide/no-upload; do
            URLS="$URLS,\"https://$HOST/$p/\""
          done
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/$KEY.txt\",\"urlList\":[$URLS]}" \
            -w '\nIndexNow HTTP %{http_code}\n'
