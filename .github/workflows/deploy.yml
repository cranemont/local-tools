# main 푸시마다 전체 앱을 빌드해 GitHub Pages로 배포한다.
# 산출 구조: / (site/index.html 랜딩) · /pdf/ · /gif/ · /video/ · /dev/ · /image/ — 각각 자기완결 단일 HTML.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # 버전은 package.json의 packageManager를 따른다
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Assemble site
        run: |
          mkdir -p _site/pdf _site/gif _site/video _site/dev _site/image
          cp -R site/. _site/
          cp apps/pdf/dist/index.html _site/pdf/index.html
          cp apps/gif/dist/index.html _site/gif/index.html
          cp apps/video/dist/index.html _site/video/index.html
          cp apps/dev/dist/index.html _site/dev/index.html
          cp apps/image/dist/index.html _site/image/index.html
          # 랜딩 카드의 용량 표기를 실제 빌드 산출물 크기로 갱신
          for app in pdf gif video dev image; do
            kb=$(( $(stat -c%s "apps/$app/dist/index.html") / 1024 ))
            sed -i "s|data-size=\"$app\">[^<]*<|data-size=\"$app\">${kb} KB<|" _site/index.html
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
