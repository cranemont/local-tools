# main 푸시마다 전체 앱을 빌드해 GitHub Pages로 배포한다.
# 산출 구조: / (site/index.html 랜딩) · /pdf/ · /gif/ — 각각 자기완결 단일 HTML.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # 버전은 package.json의 packageManager를 따른다
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Assemble site
        run: |
          mkdir -p _site/pdf _site/gif
          cp site/index.html _site/index.html
          cp apps/pdf/dist/index.html _site/pdf/index.html
          cp apps/gif/dist/index.html _site/gif/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
